<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="crestIndigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E2A8A"/>
      <stop offset="100%" stop-color="#14114A"/>
    </linearGradient>
    <linearGradient id="goldFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F47B20"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
  </defs>

  <!-- Outer Ring with Beaded Track -->
  <circle cx="100" cy="100" r="92" fill="#F6F3FF" stroke="#2E2A8A" stroke-width="4"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="#5648B0" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="100" cy="100" r="66" fill="url(#crestIndigo)"/>

  <!-- Radiating Sunburst Rays -->
  <g stroke="#CFC8F5" stroke-width="1.5" opacity="0.6">
    <line x1="100" y1="42" x2="100" y2="34"/>
    <line x1="120" y1="46" x2="124" y2="39"/>
    <line x1="80" y1="46" x2="76" y2="39"/>
    <line x1="138" y1="58" x2="144" y2="53"/>
    <line x1="62" y1="58" x2="56" y2="53"/>
  </g>

  <!-- Ceremonial Lamp of Knowledge (Deepa / Diyā) -->
  <g transform="translate(100, 102)">
    <!-- Oil Bowl -->
    <path d="M -26,8 Q -18,22 0,22 Q 18,22 26,8 Q 28,4 32,4 Q 34,4 32,8 Q 24,28 0,28 Q -24,28 -32,8 Q -34,4 -32,4 Q -28,4 -26,8 Z" fill="#F6F3FF"/>
    <!-- Lamp Base Stem -->
    <rect x="-4" y="27" width="8" height="10" rx="2" fill="#F6F3FF"/>
    <ellipse cx="0" cy="38" rx="16" ry="3.5" fill="#F6F3FF"/>

    <!-- Rising Flame -->
    <path d="M 0,4 Q -10,-10 0,-28 Q 10,-10 0,4 Z" fill="url(#goldFlame)"/>
    <path d="M 0,-2 Q -5,-12 0,-22 Q 5,-12 0,-2 Z" fill="#FFE082"/>

    <!-- Open Book of Knowledge -->
    <g transform="translate(0, 15)">
      <path d="M -16,0 Q -8,-5 0,-2 Q 8,-5 16,0 L 15,8 Q 8,4 0,7 Q -8,4 -15,8 Z" fill="#FFFFFF"/>
      <line x1="0" y1="-2" x2="0" y2="7" stroke="#2E2A8A" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Laurel Wreath Leaves on Sides -->
  <g fill="none" stroke="#F47B20" stroke-width="2" stroke-linecap="round">
    <path d="M 28,100 C 26,125 42,152 68,164"/>
    <path d="M 172,100 C 174,125 158,152 132,164"/>
  </g>

  <!-- Circular Text Inscription Path -->
  <path id="textCircle" d="M 30,100 A 70,70 0 1,1 170,100 A 70,70 0 1,1 30,100" fill="none"/>
  
  <text font-family="'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="#2E2A8A" letter-spacing="1.2">
    <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
      NATIONAL EDUCATION SOCIETY OF KARNATAKA · ESTD 1917
    </textPath>
  </text>
</svg>
