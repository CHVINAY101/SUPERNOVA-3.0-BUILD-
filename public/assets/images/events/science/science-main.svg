<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B1F" />
      <stop offset="50%" stop-color="#14143F" />
      <stop offset="100%" stop-color="#0E0F2B" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B5BFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3B5BFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0B1F" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(248, 246, 241, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="400" cy="230" r="225" fill="url(#glow)" />

  <!-- Thematic Center Illustration -->
  <g transform="translate(360, 180) scale(1.6)" stroke="#3B5BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M9 3h6M10 9h4M10 3v6l-4 9a2 2 0 0 0 1.7 3h8.6a2 2 0 0 0 1.7-3l-4-9V3"/><circle cx="10" cy="15" r="1" fill="#3B5BFF"/><circle cx="14" cy="17" r="1.5" fill="#5EEAD4"/>
  </g>

  <!-- Labeling -->
  <text x="400" y="305" text-anchor="middle" font-family="'Unbounded', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#F8F6F1" letter-spacing="0.04em">
    Science Expo
  </text>
  <text x="400" y="335" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" fill="rgba(248, 246, 241, 0.65)" letter-spacing="0.08em">
    FLAGSHIP ZONE 01
  </text>

  <!-- Supernova Badge Chip -->
  <rect x="24" y="24" width="130" height="28" rx="14" fill="rgba(248, 246, 241, 0.08)" stroke="rgba(248, 246, 241, 0.15)" />
  <text x="89" y="42" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#F8F6F1" letter-spacing="0.06em">
    SUPERNOVA 3.0
  </text>
</svg>