<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBE6FA"/>
      <stop offset="50%" stop-color="#F6F3FF"/>
      <stop offset="100%" stop-color="#DDD8F5"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E2A8A"/>
      <stop offset="100%" stop-color="#14114A"/>
    </linearGradient>
    <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5648B0"/>
      <stop offset="100%" stop-color="#2E2A8A"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#skyGrad)"/>
  
  <!-- Subtle Architectural Silhouette of The National College Heritage Building -->
  <g opacity="0.95">
    <!-- Main Hall Building -->
    <rect x="80" y="260" width="440" height="420" rx="8" fill="url(#wallGrad)"/>
    <polygon points="60,260 300,140 540,260" fill="#1C185C"/>
    
    <!-- Central Tower & Clock Dome -->
    <rect x="250" y="90" width="100" height="70" fill="#2E2A8A"/>
    <path d="M 250,90 Q 300,30 350,90 Z" fill="#5648B0"/>
    <circle cx="300" cy="120" r="18" fill="#F6F3FF"/>
    <line x1="300" y1="120" x2="300" y2="108" stroke="#2E2A8A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="300" y1="120" x2="310" y2="120" stroke="#2E2A8A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Heritage Pillars & Arches -->
    <g fill="none" stroke="#F6F3FF" stroke-width="4">
      <path d="M 120,440 A 30,30 0 0,1 180,440 V 680 H 120 Z" fill="url(#archGrad)"/>
      <path d="M 220,400 A 40,40 0 0,1 300,400 V 680 H 220 Z" fill="url(#archGrad)"/>
      <path d="M 300,400 A 40,40 0 0,1 380,400 V 680 H 300 Z" fill="url(#archGrad)"/>
      <path d="M 420,440 A 30,30 0 0,1 480,440 V 680 H 420 Z" fill="url(#archGrad)"/>
    </g>

    <!-- Upper Windows -->
    <g fill="#F6F3FF" opacity="0.85">
      <rect x="130" y="300" width="35" height="50" rx="17"/>
      <rect x="190" y="300" width="35" height="50" rx="17"/>
      <rect x="250" y="270" width="40" height="60" rx="20"/>
      <rect x="310" y="270" width="40" height="60" rx="20"/>
      <rect x="375" y="300" width="35" height="50" rx="17"/>
      <rect x="435" y="300" width="35" height="50" rx="17"/>
    </g>

    <!-- Base steps & ground -->
    <rect x="40" y="680" width="520" height="40" fill="#151240"/>
    <rect x="20" y="720" width="560" height="60" fill="#0D0B2B"/>
  </g>

  <!-- Clean Editorial Caption Plate -->
  <g transform="translate(40, 700)">
    <text x="260" y="45" font-family="'Unbounded', sans-serif" font-size="16" font-weight="800" fill="#F6F3FF" text-anchor="middle" letter-spacing="2">
      THE NATIONAL COLLEGE
    </text>
    <text x="260" y="68" font-family="'Montserrat', sans-serif" font-size="12" fill="#CFC8F5" text-anchor="middle" letter-spacing="1">
      BASAVANAGUDI · ESTD 1917
    </text>
  </g>
</svg>
