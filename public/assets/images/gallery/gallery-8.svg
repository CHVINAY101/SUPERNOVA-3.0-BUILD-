<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B1F" />
      <stop offset="50%" stop-color="#14143F" />
      <stop offset="100%" stop-color="#0E0F2B" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B5BFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3B5BFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0B1F" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(248, 246, 241, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="320" cy="220" r="216" fill="url(#glow)" />

  <!-- Thematic Center Illustration -->
  <g transform="translate(280, 170) scale(1.6)" stroke="#3B5BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><circle cx="15.5" cy="8.5" r="1.5"/>
  </g>

  <!-- Labeling -->
  <text x="320" y="295" text-anchor="middle" font-family="'Unbounded', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#F8F6F1" letter-spacing="0.04em">
    Rocket Aerodynamics
  </text>
  <text x="320" y="325" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" fill="rgba(248, 246, 241, 0.65)" letter-spacing="0.08em">
    JUNIOR CHALLENGE
  </text>

  <!-- Supernova Badge Chip -->
  <rect x="24" y="24" width="130" height="28" rx="14" fill="rgba(248, 246, 241, 0.08)" stroke="rgba(248, 246, 241, 0.15)" />
  <text x="89" y="42" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#F8F6F1" letter-spacing="0.06em">
    SUPERNOVA 3.0
  </text>
</svg>