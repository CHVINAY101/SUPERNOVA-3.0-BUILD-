<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B1F" />
      <stop offset="50%" stop-color="#14143F" />
      <stop offset="100%" stop-color="#0E0F2B" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B5BFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#3B5BFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0A0B1F" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(248, 246, 241, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />
  <circle cx="480" cy="250" r="243" fill="url(#glow)" />

  <!-- Thematic Center Illustration -->
  <g transform="translate(440, 200) scale(1.6)" stroke="#3B5BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07 19.07 4.93"/>
  </g>

  <!-- Labeling -->
  <text x="480" y="325" text-anchor="middle" font-family="'Unbounded', -apple-system, sans-serif" font-weight="800" font-size="20" fill="#F8F6F1" letter-spacing="0.04em">
    The National College
  </text>
  <text x="480" y="355" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" fill="rgba(248, 246, 241, 0.65)" letter-spacing="0.08em">
    HERITAGE CAMPUS QUADRANGLE
  </text>

  <!-- Supernova Badge Chip -->
  <rect x="24" y="24" width="130" height="28" rx="14" fill="rgba(248, 246, 241, 0.08)" stroke="rgba(248, 246, 241, 0.15)" />
  <text x="89" y="42" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#F8F6F1" letter-spacing="0.06em">
    SUPERNOVA 3.0
  </text>
</svg>