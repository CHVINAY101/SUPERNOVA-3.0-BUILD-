<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" fill="none">
  <defs>
    <!-- Combat Knife Amber/Orange Metallic Gradient -->
    <linearGradient id="knifeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD000" />
      <stop offset="40%" stop-color="#FF9900" />
      <stop offset="85%" stop-color="#E66000" />
      <stop offset="100%" stop-color="#B33E00" />
    </linearGradient>

    <!-- Knife Blade Shadow / Bevel -->
    <linearGradient id="knifeShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="50%" stop-color="#FF8800" />
      <stop offset="100%" stop-color="#D95000" />
    </linearGradient>

    <!-- Glow for knife -->
    <filter id="knifeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#FF8800" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Black Background -->
  <rect width="680" height="340" fill="#000000" rx="16" />

  <!-- FREE FIRE LOGO COMPOSITION -->
  <g id="free-fire-logo" transform="translate(40, 60)">
    
    <!-- FREE - LEFT WORDMARK (Distressed Urban Style) -->
    <g id="word-free" fill="#FFFFFF">
      <!-- LETTER F -->
      <path d="
        M40 70 
        H105 V92 
        H65 V108 
        H98 V130 
        H65 V175 
        L62 178 L58 172 L55 181 L52 170 L48 179 L44 172 L40 178 Z
      " />
      <!-- Top grunge drip on F -->
      <path d="M43 178 L45 184 L47 178 Z M54 180 L56 187 L58 179 Z" />

      <!-- LETTER R -->
      <path d="
        M118 70 
        H172 C186 70 194 77 194 92 C194 104 186 112 173 115 
        L196 174 L190 178 L182 170 L176 177 L168 152 
        H143 V174 L139 180 L134 172 L128 179 L122 171 L118 177 Z
        M143 90 V102 H168 C173 102 176 99 176 96 C176 92 173 90 168 90 Z
      " />

      <!-- LETTER E -->
      <path d="
        M204 70 
        H264 V92 
        H228 V108 
        H258 V129 
        H228 V153 
        H266 V175 
        L261 180 L256 174 L248 181 L238 174 L228 181 L218 173 L208 180 L204 176 Z
      " />
      <path d="M226 181 L228 187 L230 181 Z M246 180 L248 188 L250 180 Z" />

      <!-- LETTER E -->
      <path d="
        M274 70 
        H334 V92 
        H298 V108 
        H328 V129 
        H298 V153 
        H336 V175 
        L331 181 L326 174 L318 182 L308 173 L298 181 L288 172 L278 180 L274 175 Z
      " />
      <path d="M296 181 L298 189 L300 181 Z M316 181 L318 187 L320 181 Z" />
    </g>

    <!-- CENTER VERTICAL COMBAT KNIFE / DAGGER (Iconic Free Fire Emblem) -->
    <g id="combat-knife" transform="translate(348, 48)" filter="url(#knifeGlow)">
      <!-- Knife Pommel & Grip -->
      <!-- Pommel -->
      <polygon points="12,12 18,12 19,19 11,19" fill="#FFC800" />
      <!-- Ribbed Grip Handle -->
      <rect x="12" y="20" width="6" height="32" rx="1.5" fill="#E66A00" />
      <line x1="12" y1="26" x2="18" y2="26" stroke="#FFC800" stroke-width="1.5" />
      <line x1="12" y1="33" x2="18" y2="33" stroke="#FFC800" stroke-width="1.5" />
      <line x1="12" y1="40" x2="18" y2="40" stroke="#FFC800" stroke-width="1.5" />
      <line x1="12" y1="47" x2="18" y2="47" stroke="#FFC800" stroke-width="1.5" />

      <!-- Guard / Crossbar -->
      <path d="M5 53 H25 L23 60 H7 Z" fill="#FFB700" stroke="#CC5500" stroke-width="1" />

      <!-- Combat Blade (with recurve & jagged tactical serration) -->
      <path d="
        M8 60 
        H22 
        L21 82 
        L23 94 
        L21 106 
        L23 118 
        L15 152 
        L7 118 
        L9 106 
        L7 94 
        L9 82 Z
      " fill="url(#knifeGold)" />

      <!-- Blade Central Spine & High-Gloss Bevel -->
      <path d="M15 60 L15 152 L22 82 L21 60 Z" fill="url(#knifeShade)" opacity="0.65" />
      <line x1="15" y1="62" x2="15" y2="148" stroke="#FFE870" stroke-width="1.2" opacity="0.8" />

      <!-- Blood / Ember Drips from Knife Tip -->
      <path d="M15 152 L14 162 L15 166 L16 162 Z" fill="#FFA500" />
      <circle cx="15" cy="172" r="1.8" fill="#FF8800" />
      <circle cx="15" cy="179" r="1.2" fill="#FFA500" />
    </g>

    <!-- FIRE - RIGHT WORDMARK (Distressed Urban Style) -->
    <g id="word-fire" transform="translate(382, 0)" fill="#FFFFFF">
      <!-- LETTER F -->
      <path d="
        M40 70 
        H105 V92 
        H65 V108 
        H98 V130 
        H65 V175 
        L62 178 L58 172 L55 181 L52 170 L48 179 L44 172 L40 178 Z
      " />
      <path d="M43 178 L45 184 L47 178 Z M54 180 L56 187 L58 179 Z" />

      <!-- LETTER I -->
      <path d="
        M116 70 
        H140 V174 
        L136 180 L132 173 L127 181 L122 172 L116 177 Z
      " />
      <path d="M125 181 L127 188 L129 181 Z" />

      <!-- LETTER R -->
      <path d="
        M150 70 
        H204 C218 70 226 77 226 92 C226 104 218 112 205 115 
        L228 174 L222 178 L214 170 L208 177 L200 152 
        H175 V174 L171 180 L166 172 L160 179 L154 171 L150 177 Z
        M175 90 V102 H200 C205 102 208 99 208 96 C208 92 205 90 200 90 Z
      " />

      <!-- LETTER E -->
      <path d="
        M236 70 
        H296 V92 
        H260 V108 
        H290 V129 
        H260 V153 
        H298 V175 
        L293 181 L288 174 L280 182 L270 173 L260 181 L250 172 L240 180 L236 175 Z
      " />
      <path d="M258 181 L260 189 L262 181 Z M278 181 L280 187 L282 181 Z" />
    </g>

    <!-- Additional authentic grunge spatter along baseline -->
    <g fill="#FFFFFF" opacity="0.8">
      <circle cx="58" cy="186" r="1.2" />
      <circle cx="132" cy="186" r="1.5" />
      <circle cx="215" cy="185" r="1" />
      <circle cx="310" cy="187" r="1.4" />
      <circle cx="445" cy="186" r="1.2" />
      <circle cx="520" cy="185" r="1.5" />
      <circle cx="610" cy="186" r="1.1" />
    </g>
  </g>
</svg>
