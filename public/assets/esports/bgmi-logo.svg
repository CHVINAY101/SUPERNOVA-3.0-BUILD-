<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- BGMI Dual-Tone Indian Flag Border (Saffron / Green) -->
    <linearGradient id="bgmiBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="48%" stop-color="#FF7A00" />
      <stop offset="52%" stop-color="#00A82D" />
      <stop offset="100%" stop-color="#00A82D" />
    </linearGradient>

    <!-- Metallic Bevel for BGMI Typography -->
    <linearGradient id="bgmiTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F2F2F2" />
      <stop offset="100%" stop-color="#D9D9D9" />
    </linearGradient>

    <!-- Subtle Ambient Glow Filter -->
    <filter id="bgmiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FF7A00" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Deep Black Backdrop with Vignette -->
  <rect width="540" height="300" fill="#080808" rx="16" />

  <!-- Subtle Ambient Dust Particles -->
  <circle cx="95" cy="70" r="1.5" fill="#FFFFFF" opacity="0.35" />
  <circle cx="440" cy="85" r="1.2" fill="#FFA040" opacity="0.4" />
  <circle cx="120" cy="235" r="1.4" fill="#66DD88" opacity="0.35" />
  <circle cx="410" cy="220" r="1.8" fill="#FFFFFF" opacity="0.3" />
  <circle cx="80" cy="160" r="1.2" fill="#FFA040" opacity="0.25" />
  <circle cx="465" cy="150" r="1.5" fill="#66DD88" opacity="0.3" />

  <!-- Main Central Card Badge Container -->
  <g transform="translate(100, 45)" filter="url(#bgmiGlow)">
    <!-- Outer Card Background -->
    <rect
      x="0"
      y="0"
      width="340"
      height="210"
      rx="24"
      fill="#0B0B0C"
      stroke="url(#bgmiBorderGrad)"
      stroke-width="14"
      stroke-linejoin="round"
    />

    <!-- Inner Subtle Dark Inset Border -->
    <rect
      x="12"
      y="12"
      width="316"
      height="186"
      rx="16"
      fill="none"
      stroke="#1E1E22"
      stroke-width="2"
      opacity="0.8"
    />

    <!-- BGMI Wordmark (Heavy Block Gaming Font) -->
    <g transform="translate(170, 96)" text-anchor="middle">
      <text
        font-family="'Impact', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="78"
        font-weight="900"
        fill="url(#bgmiTextGrad)"
        letter-spacing="5"
        style="text-transform: uppercase;"
      >
        BGMI
      </text>
    </g>

    <!-- KRAFTON Lower Banner (Solid White Pill Box) -->
    <rect
      x="22"
      y="124"
      width="296"
      height="58"
      rx="6"
      fill="#FFFFFF"
    />

    <!-- KRAFTON Wordmark inside White Pill -->
    <g transform="translate(170, 163)" text-anchor="middle">
      <text
        font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="28"
        font-weight="900"
        fill="#050505"
        letter-spacing="9"
        style="text-transform: uppercase;"
      >
        KRAFTON
      </text>
    </g>
  </g>
</svg>
